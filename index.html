<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IoT & Code Academy</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [activeModule, setActiveModule] = useState(1);
      const [userXP, setUserXP] = useState(() => parseInt(localStorage.getItem('user_xp') || '0'));
      const [completedModules, setCompletedModules] = useState(() => JSON.parse(localStorage.getItem('completed_mods') || '[]'));
      
      // Simulateur Capstone State
      const [tempSim, setTempSim] = useState(24.5);
      const [relayState, setRelayState] = useState(false);
      const [networkLog, setNetworkLog] = useState([]);

      useEffect(() => {
        localStorage.setItem('user_xp', userXP.toString());
        localStorage.setItem('completed_mods', JSON.stringify(completedModules));
      }, [userXP, completedModules]);

      const completeModule = (id, xpReward) => {
        if (!completedModules.includes(id)) {
          const next = [...completedModules, id];
          setCompletedModules(next);
          setUserXP(userXP + xpReward);
        }
      };

      const sendMqttMessage = (type) => {
        const time = new Date().toLocaleTimeString();
        if (type === 'TOGGLE') {
          const newState = !relayState;
          setRelayState(newState);
          setNetworkLog(prev => [`[${time}] PUB home/relay -> {"relay": "${newState ? 'ON' : 'OFF'}"}`, ...prev.slice(0, 5)]);
        } else {
          setNetworkLog(prev => [`[${time}] POST /api/v1/telemetry -> {"temp": ${tempSim}°C}`, ...prev.slice(0, 5)]);
        }
      };

      return (
        <div className="min-h-screen flex flex-col font-sans">
          {/* Header Bar */}
          <header className="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50">
            <div className="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
              <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveTab('dashboard')}>
                <div className="p-2 bg-cyan-500/20 text-cyan-400 rounded-lg font-bold text-xl">⚡</div>
                <span className="font-bold text-lg text-slate-100">IoT & Code Academy</span>
              </div>
              <div className="flex space-x-2">
                <button 
                  onClick={() => setActiveTab('dashboard')} 
                  className={`px-4 py-2 rounded-lg text-sm font-semibold transition ${activeTab === 'dashboard' ? 'bg-cyan-500 text-slate-950' : 'text-slate-400 hover:text-white'}`}>
                  Tableau de bord
                </button>
                <button 
                  onClick={() => setActiveTab('modules')} 
                  className={`px-4 py-2 rounded-lg text-sm font-semibold transition ${activeTab === 'modules' ? 'bg-cyan-500 text-slate-950' : 'text-slate-400 hover:text-white'}`}>
                  Cours & Ateliers
                </button>
                <button 
                  onClick={() => setActiveTab('capstone')} 
                  className={`px-4 py-2 rounded-lg text-sm font-semibold transition ${activeTab === 'capstone' ? 'bg-amber-500 text-slate-950' : 'text-slate-400 hover:text-white'}`}>
                  Simulateur Capstone
                </button>
              </div>
              <div className="bg-slate-800 px-4 py-1.5 rounded-full border border-slate-700 font-bold text-amber-400 text-sm">
                🏆 {userXP} XP
              </div>
            </div>
          </header>

          {/* Main Container */}
          <main className="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
            
            {/* VIEW 1: DASHBOARD */}
            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                <div className="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-xl">
                  <h1 className="text-3xl font-extrabold text-white mb-2">Maîtrisez le C++, JavaScript et l'IoT</h1>
                  <p className="text-slate-400 mb-6 max-w-2xl">
                    Formation interactive complète : apprenez à naviguer sur GitHub, comprenez la communication entre appareils physiques et serveurs Cloud, et créez vos premières interfaces web.
                  </p>
                  <div className="flex space-x-4">
                    <button 
                      onClick={() => setActiveTab('modules')} 
                      className="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-6 py-3 rounded-xl transition shadow-lg shadow-cyan-500/20">
                      Explorer les Cours
                    </button>
                    <button 
                      onClick={() => setActiveTab('capstone')} 
                      className="bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold px-6 py-3 rounded-xl border border-slate-700 transition">
                      Lancer le Simulateur
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="bg-slate-900 p-6 rounded-xl border border-slate-800">
                    <span className="text-xs text-slate-500 font-bold uppercase tracking-wider block mb-1">Progression globale</span>
                    <div className="text-2xl font-bold text-cyan-400">Niveau {Math.floor(userXP / 100) + 1}</div>
                    <p className="text-xs text-slate-400 mt-2">{completedModules.length} sur 4 modules accomplis</p>
                  </div>
                  <div className="bg-slate-900 p-6 rounded-xl border border-slate-800">
                    <span className="text-xs text-slate-500 font-bold uppercase tracking-wider block mb-1">Sauvegarde</span>
                    <div className="text-2xl font-bold text-emerald-400">Automatique</div>
                    <p className="text-xs text-slate-400 mt-2">Votre progression reste enregistrée dans votre navigateur</p>
                  </div>
                  <div className="bg-slate-900 p-6 rounded-xl border border-slate-800">
                    <span className="text-xs text-slate-500 font-bold uppercase tracking-wider block mb-1">Projet Final</span>
                    <div className={`text-2xl font-bold ${completedModules.length === 4 ? 'text-amber-400' : 'text-slate-500'}`}>
                      {completedModules.length === 4 ? 'Prêt !' : 'En cours'}
                    </div>
                    <p className="text-xs text-slate-400 mt-2">Débloquez tous les modules pour maîtriser le projet</p>
                  </div>
                </div>
              </div>
            )}

            {/* VIEW 2: MODULES & LESSONS */}
            {activeTab === 'modules' && (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                {/* Sidebar Navigation Modules */}
                <div className="space-y-3">
                  <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Sommaire du cours</h3>
                  {[
                    { id: 1, title: "1. Navigation GitHub", desc: "Repos, Commits & Branches" },
                    { id: 2, title: "2. Architecture IoT & Cloud", desc: "HTTP, MQTT & WebSockets" },
                    { id: 3, title: "3. Comprendre le C++", desc: "Code embarqué, Setup & Loop" },
                    { id: 4, title: "4. JavaScript & APIs", desc: "DOM, Async/Await & Fetch" }
                  ].map(m => (
                    <button 
                      key={m.id}
                      onClick={() => setActiveModule(m.id)}
                      className={`w-full text-left p-4 rounded-xl border transition flex flex-col ${activeModule === m.id ? 'bg-cyan-500/10 border-cyan-500 text-white' : 'bg-slate-900 border-slate-800 text-slate-400 hover:border-slate-700'}`}>
                      <div className="flex justify-between items-center mb-1">
                        <span className="font-bold text-sm">{m.title}</span>
                        {completedModules.includes(m.id) && <span className="text-emerald-400 text-xs">✓ Fait</span>}
                      </div>
                      <span className="text-xs text-slate-500">{m.desc}</span>
                    </button>
                  ))}
                </div>

                {/* Main Content Area for Active Module */}
                <div className="md:col-span-2 bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-6">
                  {activeModule === 1 && (
                    <div className="space-y-4">
                      <span className="text-xs font-bold text-cyan-400 uppercase tracking-wide">Module 1</span>
                      <h2 className="text-2xl font-bold text-white">Naviguer dans un dépôt GitHub</h2>
                      <p className="text-slate-300 text-sm leading-relaxed">
                        Un dépôt GitHub (ou <i>repository</i>) est un dossier en ligne contenant tout le code d'un projet, ainsi que l'historique de ses modifications.
                      </p>
                      <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 text-xs space-y-2">
                        <p><strong className="text-cyan-400">README.md :</strong> Le fichier de présentation qui explique à quoi sert le projet.</p>
                        <p><strong className="text-cyan-400">Commits :</strong> Les photos instantanées (sauvegardes) du code à un instant précis.</p>
                        <p><strong className="text-cyan-400">Branches :</strong> Des versions parallèles pour développer de nouvelles fonctionnalités sans casser la version principale (<code className="text-amber-300">main</code>).</p>
                      </div>
                    </div>
                  )}

                  {activeModule === 2 && (
                    <div className="space-y-4">
                      <span className="text-xs font-bold text-cyan-400 uppercase tracking-wide">Module 2</span>
                      <h2 className="text-2xl font-bold text-white">Architecture Réseau & Communication IoT</h2>
                      <p className="text-slate-300 text-sm leading-relaxed">
                        Pour qu'un appareil physique (ex: capteur de température ESP32) communique avec une application web, il utilise des protocoles réseau.
                      </p>
                      <div className="grid grid-cols-2 gap-3 text-xs">
                        <div className="bg-slate-950 p-3 rounded-lg border border-slate-800">
                          <strong className="text-amber-400 block mb-1">HTTP / REST</strong>
                          Communication client-serveur classique (Requête → Réponse). Pratique pour envoyer des relevés de température ponctuels.
                        </div>
                        <div className="bg-slate-950 p-3 rounded-lg border border-slate-800">
                          <strong className="text-emerald-400 block mb-1">MQTT / WebSockets</strong>
                          Communication ultra-rapide et légère idéale pour l'IoT en temps réel (ex: éteindre une lampe instantanément).
                        </div>
                      </div>
                    </div>
                  )}

                  {activeModule === 3 && (
                    <div className="space-y-4">
                      <span className="text-xs font-bold text-cyan-400 uppercase tracking-wide">Module 3</span>
                      <h2 className="text-2xl font-bold text-white">Structure d'un programme C++ Embarqué</h2>
                      <p className="text-slate-300 text-sm leading-relaxed">
                        En C++ pour les puces électroniques, le programme est séparé en deux fonctions obligatoires :
                      </p>
                      <pre className="bg-slate-950 p-4 rounded-xl border border-slate-800 font-mono text-xs text-cyan-300 overflow-x-auto">
{`void setup() {
  // S'exécute 1 seule fois au démarrage
  pinMode(13, OUTPUT); // Prépare la broche de la LED
}

void loop() {
  // S'exécute en boucle infinie
  digitalWrite(13, HIGH); // Allume la LED
  delay(1000);            // Attend 1 seconde
}`}
                      </pre>
                    </div>
                  )}

                  {activeModule === 4 && (
                    <div className="space-y-4">
                      <span className="text-xs font-bold text-cyan-400 uppercase tracking-wide">Module 4</span>
                      <h2 className="text-2xl font-bold text-white">JavaScript & Interfaces Web Interactive</h2>
                      <p className="text-slate-300 text-sm leading-relaxed">
                        JavaScript s'exécute dans le navigateur de l'utilisateur pour interagir avec la page Web (DOM) et interroger des serveurs distants via <code className="text-amber-300">fetch()</code>.
                      </p>
                      <pre className="bg-slate-950 p-4 rounded-xl border border-slate-800 font-mono text-xs text-amber-300 overflow-x-auto">
{`// Requête asynchrone pour lire l'état de l'appareil
async function getTemperature() {
  const response = await fetch('/api/temp');
  const data = await response.json();
  console.log("Température actuelle :", data.value);
}`}
                      </pre>
                    </div>
                  )}

                  <div className="pt-4 border-t border-slate-800 flex justify-between items-center">
                    <span className="text-xs text-slate-500">Valider pour débloquer +100 XP</span>
                    <button 
                      onClick={() => completeModule(activeModule, 100)} 
                      className={`px-5 py-2.5 rounded-xl font-bold text-sm transition ${completedModules.includes(activeModule) ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-cyan-500 hover:bg-cyan-400 text-slate-950'}`}>
                      {completedModules.includes(activeModule) ? '✓ Module Validé (+100 XP)' : 'Marquer comme terminé (+100 XP)'}
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* VIEW 3: SIMULATOR CAPSTONE */}
            {activeTab === 'capstone' && (
              <div className="space-y-6">
                <div className="border-b border-slate-800 pb-4">
                  <h2 className="text-2xl font-bold text-white">Simulateur Capstone : C++ & JavaScript Dashboard</h2>
                  <p className="text-slate-400 text-sm mt-1">Interagissez en direct entre l'appareil virtuel (ESP32) et le tableau de bord web.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {/* Physical Device Simulator */}
                  <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
                    <h3 className="font-bold text-cyan-400 text-lg flex items-center space-x-2">
                      <span>⚙️ Appareil Physique (Microcontrôleur C++)</span>
                    </h3>

                    <div>
                      <label className="text-xs text-slate-400 font-semibold block mb-2">Ajuster la température du capteur :</label>
                      <input 
                        type="range" min="15" max="40" step="0.5" 
                        value={tempSim} 
                        onChange={(e) => setTempSim(parseFloat(e.target.value))}
                        className="w-full accent-cyan-400 cursor-pointer"
                      />
                      <div className="flex justify-between text-xs text-slate-400 mt-1">
                        <span>15°C</span>
                        <span className="text-cyan-400 font-bold text-sm">{tempSim.toFixed(1)} °C</span>
                        <span>40°C</span>
                      </div>
                    </div>

                    <div className="p-4 bg-slate-950 rounded-xl border border-slate-800">
                      <span className="text-xs text-slate-400 block mb-1">État du relais / LED physique :</span>
                      <span className={`font-bold px-3 py-1 rounded text-xs inline-block ${relayState ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40' : 'bg-rose-500/20 text-rose-400 border border-rose-500/40'}`}>
                        {relayState ? 'ALLUMÉ (HIGH)' : 'ÉTEINT (LOW)'}
                      </span>
                    </div>

                    <button 
                      onClick={() => sendMqttMessage('TELEMETRY')} 
                      className="w-full bg-slate-800 hover:bg-slate-700 text-cyan-400 font-bold py-2.5 rounded-xl border border-slate-700 transition text-sm">
                      Envoyer Télémétrie HTTP vers Cloud
                    </button>
                  </div>

                  {/* Web Dashboard Simulator */}
                  <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
                    <h3 className="font-bold text-amber-400 text-lg flex items-center space-x-2">
                      <span>🌐 Interface Web JavaScript</span>
                    </h3>

                    <p className="text-xs text-slate-400">Envoyez une commande MQTT depuis le navigateur vers l'appareil physique :</p>

                    <button 
                      onClick={() => sendMqttMessage('TOGGLE')} 
                      className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl transition shadow-lg shadow-amber-500/10 text-sm">
                      Basculer Relais à distance (MQTT)
                    </button>

                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 font-mono text-xs text-slate-400 h-40 overflow-y-auto space-y-1">
                      <div className="text-slate-600 italic">// Journal des paquets réseau transmis :</div>
                      {networkLog.length === 0 ? (
                        <div className="text-slate-600">Aucune donnée transmise. Cliquez sur un bouton au-dessus.</div>
                      ) : (
                        networkLog.map((log, idx) => <div key={idx} className="text-cyan-400">{log}</div>)
                      )}
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
